<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">When Not to Learn: selective collaboration architecture</title><desc id="desc">Five independent clients train locally, candidate updates enter a decision gate, accepted updates are aggregated, and a decision audit records accept, review, reject, or local-only outcomes.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12233a"/><stop offset="1" stop-color="#0b1020"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#62d8e8"/></marker></defs><rect width="1200" height="440" rx="22" fill="url(#g)"/><text x="42" y="48" fill="#62d8e8" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">WHEN NOT TO LEARN / SYSTEM CONCEPT</text><text x="42" y="82" fill="#edf3ff" font-family="Arial,sans-serif" font-size="26" font-weight="700">A federation that evaluates whether to learn</text><g font-family="Arial,sans-serif"><g fill="#14243a" stroke="#3a4b64" stroke-width="1.5"><rect x="42" y="130" width="185" height="62" rx="12"/><rect x="42" y="208" width="185" height="62" rx="12"/><rect x="42" y="286" width="185" height="62" rx="12"/><rect x="282" y="192" width="190" height="100" rx="15"/><rect x="535" y="192" width="190" height="100" rx="15"/><rect x="788" y="192" width="160" height="100" rx="15"/><rect x="990" y="130" width="170" height="62" rx="12"/><rect x="990" y="208" width="170" height="62" rx="12"/><rect x="990" y="286" width="170" height="62" rx="12"/></g><g fill="#edf3ff" font-size="15" font-weight="700"><text x="60" y="155">Client A</text><text x="60" y="233">Client B</text><text x="60" y="311">Client C…N</text><text x="377" y="225" text-anchor="middle">Candidate updates</text><text x="377" y="248" text-anchor="middle" font-size="12" font-weight="400" fill="#9aabc4">local data stays local</text><text x="630" y="225" text-anchor="middle">Decision gate</text><text x="630" y="248" text-anchor="middle" font-size="12" font-weight="400" fill="#9aabc4">utility + risk evidence</text><text x="868" y="225" text-anchor="middle">Aggregation</text><text x="868" y="248" text-anchor="middle" font-size="12" font-weight="400" fill="#9aabc4">only accepted updates</text><text x="1075" y="155" text-anchor="middle">ACCEPT</text><text x="1075" y="233" text-anchor="middle">REVIEW</text><text x="1075" y="311" text-anchor="middle">REJECT / LOCAL</text></g><g fill="#9aabc4" font-size="12"><text x="60" y="174">Train locally</text><text x="60" y="252">Train locally</text><text x="60" y="330">Train locally</text><text x="1007" y="174">include in round</text><text x="1007" y="252">request more evidence</text><text x="1007" y="330">keep independent</text></g><g stroke="#62d8e8" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M227 160 C250 160 255 214 282 214"/><path d="M227 239 H282"/><path d="M227 317 C250 317 255 270 282 270"/><path d="M472 242 H535"/><path d="M725 242 H788"/><path d="M948 215 C970 215 970 160 990 160"/><path d="M948 242 H990"/><path d="M948 269 C970 269 970 317 990 317"/></g><path d="M868 292 V378 H377 V292" fill="none" stroke="#8ce0b1" stroke-width="1.7" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="620" y="402" fill="#8ce0b1" font-size="12" text-anchor="middle">global model feedback → next local round</text><text x="42" y="418" fill="#71839e" font-size="10">CONCEPTUAL ARCHITECTURE · selection policy and privacy protocol remain research questions</text></g></svg>
