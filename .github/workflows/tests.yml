name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and dependencies
        run: python -m pip install -e '.[experiments,test]'
      - name: Lint
        run: python -m ruff check src tests
      - name: Run tests
        run: python -m pytest
      - name: Smoke-test the benchmark CLI
        run: python -m when_not_to_learn.benchmark --seeds 2 --sweep-seeds 1 --no-sweeps --out /tmp/bench
      - name: Smoke-test the real-data CLI
        run: python -m when_not_to_learn.realdata --seeds 1 --out /tmp/real
