[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "when-not-to-learn"
version = "0.2.0"
description = "Reproducible experiments on selective participation in federated learning under client heterogeneity and distribution shift"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Abhinav Annareddy" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
experiments = ["matplotlib>=3.7"]
test = ["pytest>=7.0"]

[project.scripts]
when-not-to-learn = "when_not_to_learn.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
